# Gradle / Android 构建配置
#
# 内存调优（2026-09-25）：本机物理内存 15.7GB，但 Gradle 默认的 G1 GC + 多 worker
# 曾触发 "Native memory allocation (malloc) failed" 让 Gradle daemon 直接崩溃。
# 改用 SerialGC、限制 worker 数、关闭并行，大幅降低本地内存(native memory)占用，
# 构建速度略降但稳定。
#
# 2026-10-02 第二十九轮补充：这台电脑**没有页面文件**（提交内存上限 = 物理内存），
# 内存一紧 Gradle daemon 会被系统直接杀掉（"Gradle build daemon disappeared"），
# Dart 的 AOT 编译器也会报「页面文件太小」。所以把堆再压一档：
#   Gradle 2048m -> 1024m，worker 2 -> 1，并给 Kotlin 编译器单独设上限。
# 构建慢一点，但不会再被系统杀。内存宽裕时想提速，把 -Xmx 和 workers 调回去即可。
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=192m -XX:+UseSerialGC
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=true

# Kotlin 编译器守护进程也单独限一下（它默认会跟着物理内存乱要）
kotlin.daemon.jvmargs=-Xmx512m

android.useAndroidX=true

# 项目路径是 D:\极迅（含中文），Gradle 默认会拒绝构建。
# 这是官方提示的关闭开关（http://b.android.com/95744），AGP 在 Windows 上处理中文路径正常。
android.overridePathCheck=true

# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
