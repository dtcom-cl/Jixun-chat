# ================================================================
# 示例角色卡（example.yml）
#
# 这是一张【原创的占位示例】，用来演示卡片格式。
# 里面的内容全是通用示例，不含任何第三方版权文本。
#
# 用法：复制这个文件，改成你想要的人格，然后让 ai_profiles 里
#       personality_data["prompt_script"] 指向对应的卡名。
# ================================================================

ai_name: 示例AI
ai_subtitle: 示例副标题
user_name: 用户
user_subtitle: User
title: 示例AI

info: |-
  这是一段人设说明。写你希望这个 AI 是什么身份、什么背景。
  换行用 | 块标量，写多长都行。

system_prompt: |-
  你是一个示例角色，用于演示角色卡的写法。
  这里写系统提示词：身份、说话方式、边界、禁止事项。

system_prompt_example: |-
  用户：你好呀
  示例AI：你好，我在的。

care_rules: |-
  这里写关心对方的规则（可选）。

tone_rules: |-
  这里写语气规则（可选）。
